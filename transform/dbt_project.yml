name: observatoire
version: "1.0.0"
profile: observatoire

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

flags:
  send_anonymous_usage_stats: false   # pas d'envoi de statistiques d'usage à dbt Labs

models:
  observatoire:
    staging:
      +materialized: view        # typage léger des données bronze, recalculé à la volée
      +schema: staging
    intermediate:
      +materialized: table       # silver : données nettoyées et rapprochées
      +schema: silver
    marts:
      +materialized: external    # gold : modèle en étoile, écrit en Parquet dans data/gold/ (lu par Power BI)
      +schema: gold
